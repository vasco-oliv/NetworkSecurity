version: '3.8'

services:
  # Dispositivos MIPS
  mips1:
    build:
      context: ./simulated-botnet/devices/mips
    container_name: mips1
    networks:
      botnet-net:
        ipv4_address: 172.20.0.2
    tmpfs:
      - /payloads

  mips2:
    build:
      context: ./simulated-botnet/devices/mips
    container_name: mips2
    networks:
      botnet-net:
        ipv4_address: 172.20.0.3
    tmpfs:
      - /payloads

  mips3:
    build:
      context: ./simulated-botnet/devices/mips
    container_name: mips3
    networks:
      botnet-net:
        ipv4_address: 172.20.0.4
    tmpfs:
      - /payloads

  # Dispositivos ARM
  arm1:
    build:
      context: ./simulated-botnet/devices/arm
    container_name: arm1
    networks:
      botnet-net:
        ipv4_address: 172.20.0.5
    tmpfs:
      - /payloads

  arm2:
    build:
      context: ./simulated-botnet/devices/arm
    container_name: arm2
    networks:
      botnet-net:
        ipv4_address: 172.20.0.6
    tmpfs:
      - /payloads

  arm3:
    build:
      context: ./simulated-botnet/devices/arm
    container_name: arm3
    networks:
      botnet-net:
        ipv4_address: 172.20.0.7
    tmpfs:
      - /payloads

  file-server:
    image: python:3.11-slim
    command: python -m http.server 8000
    working_dir: /shared
    volumes:
      - ./binaries:/shared:ro
    network_mode: "host"

  # Victim Ubuntu Container 
  victim1:
    image: ubuntu:20.04
    container_name: victim1
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
    privileged: true
    networks:
      botnet-net:
        ipv4_address: 172.20.0.10


  # Firmware Analysis: WNAP320
  firmadyne:
    build: ~/firmadyne
    privileged: true
    network_mode: "host"
    stdin_open: true
    tty: true

networks:
  botnet-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
